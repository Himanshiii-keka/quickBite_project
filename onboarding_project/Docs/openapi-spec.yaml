openapi: 3.0.3
info:
  title: QuickBite API
  description: |
    # QuickBite Food Delivery API

    A complete REST API for a food delivery application built with .NET 8.

    ## Features
    - **Authentication**: JWT-based authentication with User and Admin roles
    - **Restaurants**: Browse active restaurants and their menus
    - **Cart**: Add/remove items, single restaurant per cart
    - **Orders**: Place orders, track status, order history
    - **Admin**: Manage restaurants, menu items, and order statuses

    ## Authentication
    Most endpoints require a JWT Bearer token. To authenticate:
    1. Register a new account via `POST /api/auth/register`
    2. Login via `POST /api/auth/login` to get a JWT token
    3. Include the token in the `Authorization` header: `Bearer <your-token>`

    ## Roles
    - **User**: Can browse restaurants, manage cart, place orders, view own orders
    - **Admin**: Can manage restaurants, menu items, view all orders, update order status

  version: 1.0.0
  contact:
    name: QuickBite Support
    email: support@quickbite.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:5227
    description: Development server
  - url: https://localhost:7227
    description: Development server (HTTPS)

tags:
  - name: Auth
    description: Authentication endpoints (register, login)
  - name: Restaurants
    description: Browse restaurants and menus (User)
  - name: Cart
    description: Shopping cart management (User)
  - name: Orders
    description: Order placement and history (User)
  - name: Admin
    description: Restaurant and menu management (Admin only)
  - name: Admin Orders
    description: Order management (Admin only)

paths:
  # ==================== AUTH ====================
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: Creates a new user account. Set `isAdmin` to true for Admin role, false for User role.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: "John Doe"
              email: "john@example.com"
              phoneNumber: "9876543210"
              password: "SecurePass123"
              isAdmin: false
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
              example:
                message: "User registered successfully."
                data:
                  token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  name: "John Doe"
                  email: "john@example.com"
                  role: "User"
        '400':
          description: Validation error or email/phone already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessageResponse'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      description: Authenticates user and returns a JWT token.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: "john@example.com"
              password: "SecurePass123"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessageResponse'
              example:
                message: "Invalid email or password."

  # ==================== RESTAURANTS (User) ====================
  /api/restaurants:
    get:
      tags: [Restaurants]
      summary: List all active restaurants
      description: Returns all restaurants where `isActive = true`. Cached for performance.
      operationId: getActiveRestaurants
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of active restaurants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RestaurantViewModel'
              example:
                - id: 1
                  name: "Pizza Palace"
                  city: "Mumbai"
                  address: "123 Main St, Andheri"
                  rating: 4.5
                  isActive: true
                - id: 2
                  name: "Burger Barn"
                  city: "Delhi"
                  address: "456 Oak Ave, Connaught Place"
                  rating: 4.2
                  isActive: true
        '401':
          description: Unauthorized - JWT token required

  /api/restaurants/{id}:
    get:
      tags: [Restaurants]
      summary: Get restaurant by ID
      description: Returns details of a single active restaurant.
      operationId: getRestaurantById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Restaurant details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantViewModel'
        '404':
          description: Restaurant not found or inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessageResponse'

  /api/restaurants/{id}/menu:
    get:
      tags: [Restaurants]
      summary: Get restaurant menu
      description: Returns available menu items for an active restaurant.
      operationId: getRestaurantMenu
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: List of available menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItemViewModel'
              example:
                - id: 101
                  restaurantId: 1
                  name: "Margherita Pizza"
                  description: "Classic tomato and mozzarella"
                  price: 299.00
                  isAvailable: true
                - id: 102
                  restaurantId: 1
                  name: "Pepperoni Pizza"
                  description: "Loaded with pepperoni"
                  price: 349.00
                  isAvailable: true
        '404':
          description: Restaurant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessageResponse'

  # ==================== CART (User) ====================
  /api/cart:
    get:
      tags: [Cart]
      summary: Get current user's cart
      description: Returns the user's cart with all items. Returns empty cart if none exists.
      operationId: getCart
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cart details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartViewModel'
              example:
                restaurantId: 1
                restaurantName: "Pizza Palace"
                items:
                  - menuItemId: 101
                    itemName: "Margherita Pizza"
                    unitPrice: 299.00
                    quantity: 2
                    lineTotal: 598.00
                totalAmount: 598.00
        '401':
          description: Unauthorized

    delete:
      tags: [Cart]
      summary: Clear the cart
      description: Removes all items from the cart. Allows ordering from a different restaurant.
      operationId: clearCart
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cart cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: "Cart cleared."

  /api/cart/items:
    post:
      tags: [Cart]
      summary: Add item to cart
      description: |
        Adds a menu item to the cart. If item already exists, quantity is incremented.

        **Important**: A cart can only contain items from ONE restaurant at a time.
        If the cart has items from a different restaurant, returns 409 Conflict.
      operationId: addCartItem
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
            example:
              menuItemId: 101
              quantity: 2
      responses:
        '200':
          description: Item added to cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartViewModel'
        '400':
          description: Menu item unavailable or restaurant inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessageResponse'
        '404':
          description: Menu item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessageResponse'
        '409':
          description: Cart contains items from another restaurant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessageResponse'
              example:
                message: "Your cart already contains items from another restaurant. Please clear it before ordering from a different restaurant."

  /api/cart/items/{menuItemId}:
    delete:
      tags: [Cart]
      summary: Remove item from cart
      description: Removes a single menu item from the cart.
      operationId: removeCartItem
      security:
        - bearerAuth: []
      parameters:
        - name: menuItemId
          in: path
          required: true
          schema:
            type: integer
          example: 101
      responses:
        '200':
          description: Item removed from cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartViewModel'
        '404':
          description: Cart is empty or item not in cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessageResponse'

  # ==================== ORDERS (User) ====================
  /api/orders/checkout:
    post:
      tags: [Orders]
      summary: Place an order (checkout)
      description: |
        Creates an order from the current cart contents.
        - Snapshots current prices into order items
        - Empties the cart on success
        - Validates all items are still available
      operationId: checkout
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Order placed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderViewModel'
              example:
                id: 1001
                restaurantId: 1
                restaurantName: "Pizza Palace"
                status: "Placed"
                totalAmount: 598.00
                orderPlacedAt: "2025-01-15T10:30:00Z"
                updatedAt: "2025-01-15T10:30:00Z"
                items:
                  - itemName: "Margherita Pizza"
                    itemPrice: 299.00
                    quantity: 2
                    lineTotal: 598.00
                customerName: "John Doe"
                customerEmail: "john@example.com"
        '400':
          description: Cart is empty or item unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessageResponse'

  /api/orders/my:
    get:
      tags: [Orders]
      summary: Get user's order history
      description: Returns all orders for the current user, newest first.
      operationId: getMyOrders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of user's orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderViewModel'

  /api/orders/my/{id}:
    get:
      tags: [Orders]
      summary: Get specific order by ID
      description: Returns details of a specific order belonging to the current user.
      operationId: getMyOrderById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1001
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderViewModel'
        '403':
          description: Order belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessageResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessageResponse'

  # ==================== ADMIN - RESTAURANTS ====================
  /api/admin/restaurants:
    get:
      tags: [Admin]
      summary: List all restaurants (Admin)
      description: Returns ALL restaurants including inactive ones.
      operationId: getAllRestaurantsAdmin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of all restaurants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RestaurantViewModel'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin role required

    post:
      tags: [Admin]
      summary: Create a new restaurant
      description: Creates a new restaurant.
      operationId: createRestaurant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRestaurantRequest'
            example:
              name: "Taco Town"
              city: "Bangalore"
              address: "789 MG Road"
              rating: 4.0
              isActive: true
      responses:
        '201':
          description: Restaurant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantViewModel'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'

  /api/admin/restaurants/{id}:
    put:
      tags: [Admin]
      summary: Update a restaurant
      description: Updates restaurant details. Only supplied fields are changed (partial update).
      operationId: updateRestaurant
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRestaurantRequest'
            example:
              name: "Pizza Palace Premium"
              rating: 4.8
      responses:
        '200':
          description: Restaurant updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantViewModel'
        '404':
          description: Restaurant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessageResponse'

  # ==================== ADMIN - MENU ITEMS ====================
  /api/admin/restaurants/{restaurantId}/menu:
    get:
      tags: [Admin]
      summary: Get all menu items for a restaurant (Admin)
      description: Returns ALL menu items including unavailable ones.
      operationId: getMenuAdmin
      security:
        - bearerAuth: []
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: List of menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItemViewModel'
        '404':
          description: Restaurant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessageResponse'

    post:
      tags: [Admin]
      summary: Create a menu item
      description: Adds a new menu item to a restaurant.
      operationId: createMenuItem
      security:
        - bearerAuth: []
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMenuItemRequest'
            example:
              name: "Veggie Supreme Pizza"
              description: "Loaded with fresh vegetables"
              price: 329.00
              isAvailable: true
      responses:
        '201':
          description: Menu item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemViewModel'
        '404':
          description: Restaurant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessageResponse'

  /api/admin/menu/{id}:
    put:
      tags: [Admin]
      summary: Update a menu item
      description: Updates menu item details. Only supplied fields are changed.
      operationId: updateMenuItem
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 101
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMenuItemRequest'
            example:
              price: 349.00
              isAvailable: false
      responses:
        '200':
          description: Menu item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemViewModel'
        '404':
          description: Menu item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessageResponse'

    delete:
      tags: [Admin]
      summary: Delete a menu item
      description: |
        Deletes a menu item. Returns 409 if the item appears in any historical order.
        In that case, set `isAvailable = false` instead.
      operationId: deleteMenuItem
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 101
      responses:
        '200':
          description: Menu item deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: "Menu item deleted."
        '404':
          description: Menu item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessageResponse'
        '409':
          description: Cannot delete - item has order history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessageResponse'
              example:
                message: "Cannot delete this menu item because it appears in existing orders. Set IsAvailable=false instead."

  # ==================== ADMIN - ORDERS ====================
  /api/orders:
    get:
      tags: [Admin Orders]
      summary: List all orders (Admin)
      description: Returns all orders with optional filters. Includes customer details.
      operationId: getAllOrders
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: integer
            enum: [1, 2, 3, 4, 5, 6]
          description: |
            Filter by status:
            - 1 = Placed
            - 2 = Confirmed
            - 3 = Preparing
            - 4 = OutForDelivery
            - 5 = Delivered
            - 6 = Cancelled
        - name: restaurantId
          in: query
          required: false
          schema:
            type: integer
          description: Filter by restaurant ID
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderViewModel'
              example:
                - id: 1001
                  restaurantId: 1
                  restaurantName: "Pizza Palace"
                  status: "Placed"
                  totalAmount: 598.00
                  orderPlacedAt: "2025-01-15T10:30:00Z"
                  updatedAt: "2025-01-15T10:30:00Z"
                  items:
                    - itemName: "Margherita Pizza"
                      itemPrice: 299.00
                      quantity: 2
                      lineTotal: 598.00
                  customerName: "John Doe"
                  customerEmail: "john@example.com"

  /api/orders/{id}/status:
    patch:
      tags: [Admin Orders]
      summary: Update order status
      description: |
        Updates the status of an order. Terminal states (Delivered, Cancelled) cannot be changed.

        **Status Values:**
        - 1 = Placed
        - 2 = Confirmed
        - 3 = Preparing
        - 4 = OutForDelivery
        - 5 = Delivered (terminal)
        - 6 = Cancelled (terminal)
      operationId: updateOrderStatus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
            example:
              status: 2
      responses:
        '200':
          description: Order status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderViewModel'
        '400':
          description: Invalid status or order is in terminal state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessageResponse'
              example:
                message: "Order is already Delivered and cannot be changed."
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessageResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from login endpoint

  schemas:
    # ==================== AUTH ====================
    RegisterRequest:
      type: object
      required: [name, email, phoneNumber, password]
      properties:
        name:
          type: string
          maxLength: 100
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john@example.com"
        phoneNumber:
          type: string
          pattern: '^\d{10}$'
          example: "9876543210"
        password:
          type: string
          minLength: 6
          example: "SecurePass123"
        isAdmin:
          type: boolean
          default: false
          description: Set to true to create an Admin account

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: "john@example.com"
        password:
          type: string
          example: "SecurePass123"

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT Bearer token
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [User, Admin]

    AuthSuccessResponse:
      type: object
      properties:
        message:
          type: string
        data:
          $ref: '#/components/schemas/AuthResponse'

    # ==================== RESTAURANT ====================
    RestaurantViewModel:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        city:
          type: string
        address:
          type: string
        rating:
          type: number
          format: decimal
          minimum: 0
          maximum: 5
        isActive:
          type: boolean

    CreateRestaurantRequest:
      type: object
      required: [name, city, address]
      properties:
        name:
          type: string
          maxLength: 150
        city:
          type: string
          maxLength: 100
        address:
          type: string
          maxLength: 300
        rating:
          type: number
          format: decimal
          minimum: 0
          maximum: 5
          default: 0
        isActive:
          type: boolean
          default: true

    UpdateRestaurantRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
        city:
          type: string
          maxLength: 100
        address:
          type: string
          maxLength: 300
        rating:
          type: number
          format: decimal
          minimum: 0
          maximum: 5
        isActive:
          type: boolean

    # ==================== MENU ITEM ====================
    MenuItemViewModel:
      type: object
      properties:
        id:
          type: integer
        restaurantId:
          type: integer
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: decimal
        isAvailable:
          type: boolean

    CreateMenuItemRequest:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
          maxLength: 150
        description:
          type: string
          maxLength: 500
        price:
          type: number
          format: decimal
          minimum: 0.01
        isAvailable:
          type: boolean
          default: true

    UpdateMenuItemRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
        description:
          type: string
          maxLength: 500
        price:
          type: number
          format: decimal
          minimum: 0.01
        isAvailable:
          type: boolean

    # ==================== CART ====================
    CartItemViewModel:
      type: object
      properties:
        menuItemId:
          type: integer
        itemName:
          type: string
        unitPrice:
          type: number
          format: decimal
        quantity:
          type: integer
        lineTotal:
          type: number
          format: decimal

    CartViewModel:
      type: object
      properties:
        restaurantId:
          type: integer
          nullable: true
        restaurantName:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItemViewModel'
        totalAmount:
          type: number
          format: decimal

    AddCartItemRequest:
      type: object
      required: [menuItemId]
      properties:
        menuItemId:
          type: integer
        quantity:
          type: integer
          minimum: 1
          maximum: 99
          default: 1

    # ==================== ORDER ====================
    OrderItemViewModel:
      type: object
      properties:
        itemName:
          type: string
        itemPrice:
          type: number
          format: decimal
        quantity:
          type: integer
        lineTotal:
          type: number
          format: decimal

    OrderViewModel:
      type: object
      properties:
        id:
          type: integer
        restaurantId:
          type: integer
        restaurantName:
          type: string
        status:
          type: string
          enum: [Placed, Confirmed, Preparing, OutForDelivery, Delivered, Cancelled]
        totalAmount:
          type: number
          format: decimal
        orderPlacedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemViewModel'
        customerName:
          type: string
          nullable: true
          description: Populated for admin views
        customerEmail:
          type: string
          nullable: true
          description: Populated for admin views

    UpdateOrderStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: integer
          enum: [1, 2, 3, 4, 5, 6]
          description: |
            1=Placed, 2=Confirmed, 3=Preparing, 4=OutForDelivery, 5=Delivered, 6=Cancelled

    # ==================== COMMON ====================
    ErrorMessageResponse:
      type: object
      properties:
        message:
          type: string

    ValidationProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
